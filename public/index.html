<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Neo Writer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <!-- marked for markdown rendering (lightweight CDN) -->
  <script src="marked.min.js"></script>
  <!-- mermaid for diagram rendering -->
  <script src="mermaid.min.js"></script>
</head>
<body>
  <header>
    <h1>Neo Writer</h1>
    <div id="open-story-name" style="display:inline-block; margin-left:16px; font-weight:600;"></div>
    <button id="toggle-publish" style="position:absolute; right:560px; top:14px; font-size:0.75rem; padding:4px 10px; border:1px solid #ccc; border-radius:4px; background:#f5f5f5; color:#888; cursor:pointer; font-weight:500; display:none;">Published ✗</button>
    <button id="toggle-highlights" style="position:absolute; right:420px; top:14px; font-size:0.75rem; padding:4px 10px; border:1px solid #ccc; border-radius:4px; background:#e3ecff; color:#2b7cff; cursor:pointer; font-weight:500;">Highlights ✓</button>
    <div id="speech-controls" style="position:absolute; right:200px; top:12px; display:inline-flex; align-items:center; gap:4px;">
      <select id="speech-lang" class="speech-lang" title="Speech language">
        <option value="en-US">EN-US</option>
        <option value="en-GB">EN-UK</option>
        <option value="fr-FR">FR</option>
        <option value="de-DE">DE</option>
        <option value="es-ES">ES</option>
        <option value="it-IT">IT</option>
        <option value="pt-BR">PT</option>
        <option value="ja-JP">JA</option>
        <option value="zh-CN">ZH</option>
      </select>
      <button id="btn-mic" class="btn-mic" title="Speech to text">🎤</button>
    </div>
    <a href="https://github.com/valvolt/neowriter" target="_blank" rel="noopener noreferrer" title="GitHub" style="position:absolute; right:160px; top:13px; color:#555; display:inline-flex; align-items:center;"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
    <div id="user-info" style="position:absolute; right:16px; top:14px; font-size:0.85rem; color:#333; display:inline-flex; align-items:center; gap:8px; max-width:170px;"></div>
  </header>

  <!-- expose local_mode and username to the client -->
  <script>
    window.local_mode = true;
    window.username = 'anonymous';
  </script>

  <main>
    <aside id="menu">
      <!-- Story list view -->
      <div class="menu-controls">
        <button id="btn-new">New</button>
      </div>
      <div id="global-todo-section" class="binder-section" style="margin-bottom:8px;">
        <ul class="binder-list" style="margin:0;">
          <li id="global-todo-entry" class="tile-item todo-entry">
            <span class="tile-name">Todo</span>
            <span id="global-todo-count-badge" class="highlight-count" style="display:none"></span>
          </li>
        </ul>
      </div>
      <ul id="story-list"></ul>

      <!-- Binder view (hidden by default) -->
      <div id="binder" style="display:none;">
        <div class="binder-header">
          <button id="btn-back" class="btn-back" title="Back to stories">← Back</button>
          <span id="binder-story-name" class="binder-story-name"></span>
        </div>
        <div class="binder-section">
          <div class="binder-section-header">
            <span class="binder-section-title">Todo</span>
          </div>
          <ul class="binder-list">
            <li id="binder-todo-entry" class="tile-item todo-entry">
              <span class="tile-name">Todo</span>
              <span id="todo-count-badge" class="highlight-count" style="display:none"></span>
            </li>
          </ul>
        </div>
        <div class="binder-section">
          <div class="binder-section-header">
            <span class="binder-section-title">Tiles</span>
            <button id="btn-add-tile" class="btn-add-tile" title="Add tile">+</button>
          </div>
          <ul id="binder-tiles-list" class="binder-list"></ul>
        </div>
        <div class="binder-section">
          <div class="binder-section-header">
            <span class="binder-section-title">Highlights</span>
            <div style="display:inline-flex;align-items:center;gap:4px;">
              <select id="highlights-sort" class="highlights-sort" title="Sort highlights">
                <option value="" disabled>— key —</option>
                <option value="alpha" selected>A→Z</option>
                <option value="most">Most</option>
                <option value="least">Least</option>
              </select>
              <button id="btn-add-highlight" class="btn-add-tile" title="Add highlight">+</button>
            </div>
          </div>
          <ul id="binder-highlights-list" class="binder-list"></ul>
        </div>
      </div>
    </aside>

    <div class="resize-handle" id="resize-menu"></div>
    <section id="editor-pane">
      <textarea id="editor" placeholder="Start typing markdown..." spellcheck="false"></textarea>
    </section>
    <div class="resize-handle" id="resize-editor"></div>
    <section id="render-pane">
      <div id="preview"></div>
    </section>
  </main>

  <footer>
    <div id="stats">Words: 0 — Chars: 0</div>
    <div id="current-name"></div>
  </footer>

  <!-- Custom context menu -->
  <div id="context-menu" class="context-menu" style="display:none;">
    <ul>
      <li data-action="insert-table">Insert Table</li>
      <li data-action="insert-link">Insert Link</li>
      <li data-action="insert-picture">Insert Picture</li>
      <li data-action="insert-keyword">Insert Keyword</li>
      <li data-action="create-highlight">Create Highlight</li>
    </ul>
  </div>

  <!-- Insert Picture dialog -->
  <div id="picture-dialog-overlay" class="dialog-overlay" style="display:none;">
    <div class="dialog">
      <h3>Insert Picture</h3>
      <label class="dialog-label">Name (without extension):</label>
      <input type="text" id="picture-dialog-name" class="dialog-input" placeholder="e.g. my-photo" />
      <label class="dialog-label">From URL:</label>
      <input type="text" id="picture-dialog-url" class="dialog-input" placeholder="https://example.com/image.png" />
      <label class="dialog-label">Or upload from disk:</label>
      <input type="file" id="picture-dialog-file" accept="image/*" />
      <div class="dialog-buttons">
        <button id="picture-dialog-cancel" class="dialog-btn">Cancel</button>
        <button id="picture-dialog-ok" class="dialog-btn dialog-btn-primary">Insert</button>
      </div>
    </div>
  </div>

  <!-- Highlight hover tooltip -->
  <div id="highlight-tooltip" class="highlight-tooltip" style="display:none;">
    <div id="highlight-tooltip-text" class="highlight-tooltip-text"></div>
    <img id="highlight-tooltip-img" class="highlight-tooltip-img" style="display:none;" />
  </div>

  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Neo Writer — Reading</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/marked.min.js"></script>
  <style>
    :root {
      --accent: #2b7cff;
    }
    * { box-sizing: border-box; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    body {
      margin: 0;
      background: #f7f7f8;
      color: #111;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 16px 24px;
      background: #fff;
      border-bottom: 1px solid #e6e6e9;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      color: var(--accent);
    }
    header .story-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    header .story-author {
      font-size: 13px;
      color: #888;
      margin-left: auto;
    }
    header a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }
    header a:hover { text-decoration: underline; }
    main {
      flex: 1;
      max-width: 780px;
      margin: 32px auto;
      padding: 32px 40px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      line-height: 1.7;
      font-size: 16px;
      width: 100%;
    }
    main h1, main h2, main h3, main h4, main h5, main h6 {
      margin-top: 1.5em;
      margin-bottom: 0.5em;
    }
    main p { margin: 0.8em 0; }
    main img { max-width: 100%; border-radius: 4px; }
    main blockquote {
      border-left: 3px solid var(--accent);
      margin: 1em 0;
      padding: 0.5em 1em;
      background: #f0f6ff;
      color: #333;
    }
    main code {
      background: #f0f0f2;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.9em;
    }
    main pre {
      background: #f0f0f2;
      padding: 12px 16px;
      border-radius: 6px;
      overflow-x: auto;
    }
    main pre code {
      background: none;
      padding: 0;
    }
    main table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    main th, main td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }
    main th { background: #f7f7f8; font-weight: 600; }
    .loading {
      text-align: center;
      padding: 60px;
      color: #888;
      font-style: italic;
    }
    .error {
      text-align: center;
      padding: 60px;
      color: #c00;
    }
    @media (max-width: 860px) {
      main { margin: 16px; padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="/" style="color:inherit;text-decoration:none;">Neo Writer</a></h1>
    <span class="story-title" id="story-title"></span>
    <span class="story-author" id="story-author"></span>
  </header>
  <main id="content">
    <div class="loading">Loading story…</div>
  </main>

  <script>
    (async () => {
      const contentEl = document.getElementById('content');
      const titleEl = document.getElementById('story-title');
      const authorEl = document.getElementById('story-author');

      // Extract username and id from URL: /read/:username/:id
      const parts = window.location.pathname.split('/').filter(Boolean);
      if (parts.length < 3 || parts[0] !== 'read') {
        contentEl.innerHTML = '<div class="error">Invalid URL</div>';
        return;
      }
      const username = parts[1];
      const storyId = parts[2];

      try {
        const res = await fetch(`/public/story/${username}/${storyId}`);
        if (!res.ok) {
          contentEl.innerHTML = '<div class="error">Story not found or not published.</div>';
          return;
        }
        const data = await res.json();

        // Set title and author
        titleEl.textContent = data.name || 'Untitled';
        authorEl.textContent = data.author ? `by ${data.author}` : '';
        document.title = `${data.name || 'Untitled'} — Neo Writer`;

        // Rewrite image paths: ![alt](/api/story/ID/pictures/FILE) → /public/story/USERNAME/ID/pictures/FILE
        let markdown = data.content || '';
        markdown = markdown.replace(
          /!\[([^\]]*)\]\(\/api\/story\/[^/]+\/pictures\/([^)]+)\)/g,
          `![$1](/public/story/${username}/${storyId}/pictures/$2)`
        );

        // Pre-process: convert standalone *** to dinkus, em-dash dialogue
        markdown = markdown.replace(/^\*{3}$/gm, '<p style="text-align:center;letter-spacing:1em;margin:1em 0;">✦✦✦</p>');
        markdown = markdown.replace(/^- (?!\[[ xX]\])/gm, '\u2014 ');

        // Render markdown
        if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
          contentEl.innerHTML = marked.parse(markdown);
        } else {
          contentEl.innerHTML = '<pre>' + markdown.replace(/</g, '&lt;') + '</pre>';
        }

        // Post-process: arrow replacements
        const walker = document.createTreeWalker(contentEl, NodeFilter.SHOW_TEXT, null, false);
        let node;
        while ((node = walker.nextNode())) {
          if (!node.parentElement) continue;
          if (node.parentElement.closest('code, pre')) continue;
          node.nodeValue = node.nodeValue
            .replace(/<-->|<-->/g, '\u2194')
            .replace(/-->|-->/g, '\u2192')
            .replace(/<--|<--/g, '\u2190')
            .replace(/<==>|<==>/g, '\u21D4')
            .replace(/==>|==>/g, '\u21D2')
            .replace(/<==|<==/g, '\u21D0');
        }

      } catch (e) {
        console.error(e);
        contentEl.innerHTML = '<div class="error">Failed to load story.</div>';
      }
    })();
  </script>
</body>
</html>
